---
# Stoat (formerly Revolt) self-hosted chat, v0.13.6.
# Rebuilt from the upstream self-hosted stack (github.com/revoltchat/self-hosted)
# and adapted to this homelab:
#   - Traefik terminates TLS for chat.rt-541.io and fronts the internal caddy,
#     which does the /api /ws /autumn /january path routing (see ./Caddyfile).
#   - caddy runs in reverse-proxy mode (HOSTNAME=:80 in .env.web), no host ports.
#   - Config: ./Revolt.toml (mounted), ./secrets.env + ./.env.web (env_file).
# Service KEYS must stay database/redis/rabbit/minio/api/events/autumn/january/web
# because the images default to those hostnames and ./Caddyfile references them.
# Regenerate config with: github.com/revoltchat/self-hosted -> generate_config.sh
#   (answer "y" to the reverse-proxy prompt to keep HOSTNAME=:80).

networks:
  default:
    name: revolt-internal
  proxy:
    external: true

services:
  # MongoDB: primary database
  database:
    image: mongo:8
    container_name: revolt-mongo
    restart: unless-stopped
    volumes:
      - /docker/revolt/db:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2G

  # KeyDB: event message broker & KV store (image default host "redis")
  redis:
    image: eqalpha/keydb:latest  # keydb has no clean semver tags; pinned-by-latest
    container_name: revolt-keydb
    restart: unless-stopped
    volumes:
      - /docker/revolt/redis:/data
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  # RabbitMQ: internal message broker
  rabbit:
    image: rabbitmq:4
    container_name: revolt-rabbit
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rabbituser
      RABBITMQ_DEFAULT_PASS: CHANGEME
    volumes:
      - /docker/revolt/rabbit:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  # MinIO: S3-compatible object storage (internal only; not exposed via Traefik).
  # Creds are the upstream defaults (minioautumn) because the file-server's
  # compiled [files.s3] config expects them; minio is unreachable off the
  # revolt-internal network so this is acceptable.
  minio:
    image: minio/minio:latest
    container_name: revolt-minio
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioautumn
      MINIO_ROOT_PASSWORD: minioautumn
      MINIO_DOMAIN: minio
    volumes:
      - /docker/revolt/minio:/data
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G

  # One-shot: create the uploads bucket once minio is ready
  createbuckets:
    image: minio/mc:latest
    container_name: revolt-createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:9000 minioautumn minioautumn;
        echo 'Waiting minio...' && sleep 1;
      done;
      /usr/bin/mc mb minio/revolt-uploads;
      exit 0;
      "

  # Caddy: internal reverse proxy (path routing). Fronted by Traefik on
  # chat.rt-541.io. No lan-only middleware -> reachable like the old revolt;
  # add traefik.http.routers.revolt.middlewares=lan-only@docker to gate to LAN.
  caddy:
    image: caddy:2
    container_name: revolt-caddy
    restart: unless-stopped
    env_file: .env.web
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /docker/revolt/caddy-data:/data
      - /docker/revolt/caddy-config:/config
    networks:
      default: {}
      proxy: {}
    labels:
      traefik.enable: true
      traefik.docker.network: proxy
      traefik.http.routers.revolt.rule: Host(`chat.rt-541.io`)
      traefik.http.routers.revolt.entrypoints: secure
      traefik.http.routers.revolt.tls: true
      traefik.http.routers.revolt.tls.certresolver: default
      traefik.http.services.revolt.loadbalancer.server.port: 80
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # API server (Rocket, :14702)
  api:
    image: ghcr.io/stoatchat/api:v0.13.6
    container_name: revolt-api
    restart: unless-stopped
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - ./Revolt.toml:/Revolt.toml
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1G

  # Events / websocket service (:14703)
  events:
    image: ghcr.io/stoatchat/events:v0.13.6
    container_name: revolt-events
    restart: unless-stopped
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./Revolt.toml:/Revolt.toml
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  # File server / attachments (:14704)
  autumn:
    image: ghcr.io/stoatchat/file-server:v0.13.6
    container_name: revolt-autumn
    restart: unless-stopped
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_started
    volumes:
      - ./Revolt.toml:/Revolt.toml

  # Metadata / image proxy (:14705)
  january:
    image: ghcr.io/stoatchat/proxy:v0.13.6
    container_name: revolt-january
    restart: unless-stopped
    env_file: secrets.env
    volumes:
      - ./Revolt.toml:/Revolt.toml

  # Scheduled task daemon
  crond:
    image: ghcr.io/stoatchat/crond:v0.13.6
    container_name: revolt-crond
    restart: unless-stopped
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./Revolt.toml:/Revolt.toml

  # Push notification daemon
  pushd:
    image: ghcr.io/stoatchat/pushd:v0.13.6
    container_name: revolt-pushd
    restart: unless-stopped
    env_file: secrets.env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - ./Revolt.toml:/Revolt.toml

  # Web client (:5000)
  web:
    image: ghcr.io/stoatchat/for-web:4414eac
    container_name: revolt-web
    restart: unless-stopped
    env_file: .env.web
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
