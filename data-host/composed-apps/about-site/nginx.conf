# Pages are revalidated on every load (an ETag round trip) so a redeploy shows at once; everything else
# keeps an hour. Renders and PDFs that keep their filename across regenerations are also versioned by a
# content-hash query string in the pages that embed them (src/lib/versioned.ts).
map $sent_http_content_type $cache_control {
  default    "public, max-age=3600, must-revalidate";
  ~^text/html "no-cache";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  # Long cache for hashed assets
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Default cache for everything else: an hour, except HTML which is always revalidated (see the map above)
  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control $cache_control;
  }

  # Custom 404 page from Astro's prerendered 404.html
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
