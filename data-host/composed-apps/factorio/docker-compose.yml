---
services:
  factorio:
    image: factoriotools/factorio
    container_name: factorio
    restart: unless-stopped
    ports:
      - 34197:34197/udp
      - 27015:27015/tcp
    volumes:
      - /docker/game/factorio:/factorio
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '2'
          memory: 2G
