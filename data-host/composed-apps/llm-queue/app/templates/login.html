{% extends "base.html" %}
{% block title %}login · llm-queue{% endblock %}
{% block body %}
<div class="panel" style="max-width:420px;margin:3rem auto;">
  <h2 style="margin-top:0;">llm-queue</h2>
  <p class="muted">Enter your API key to continue.</p>
  {% if error %}<p style="color:var(--bad);">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="key">API key</label>
    <input type="password" id="key" name="key" placeholder="API key" autofocus>
    <div style="margin-top:1rem;"><button type="submit">Sign in</button></div>
  </form>
</div>
{% endblock %}
