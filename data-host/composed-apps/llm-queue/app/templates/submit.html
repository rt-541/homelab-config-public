{% extends "base.html" %}
{% block title %}submit · llm-queue{% endblock %}
{% block body %}
<div class="panel">
  <h2 style="margin-top:0;">Submit a job</h2>
  <form method="post" action="/submit">
    <label for="prompt">Prompt</label>
    <textarea id="prompt" name="prompt" placeholder="Ask anything..." required></textarea>
    <div class="row">
      <div>
        <label for="alias">Backend</label>
        <select id="alias" name="alias">
          <option value="">Auto (pick for me)</option>
          {% for a in aliases %}
          <option value="{{ a.alias }}">{{ a.alias }} — {{ a.tier }} ({{ a.model }})</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="latency">Latency</label>
        <select id="latency" name="latency">
          <option value="interactive">interactive</option>
          <option value="batch">batch</option>
        </select>
      </div>
    </div>
    <div style="margin-top:1rem;"><button type="submit">Queue job</button></div>
  </form>
</div>
{% endblock %}
