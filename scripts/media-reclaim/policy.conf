# media-reclaim policy knobs (nemesis-side scripts).
# The devastator transcoder has its own transcode-policy.conf.

# A movie file larger than this (GiB) is a transcode candidate.
TRANSCODE_MIN_GB=30

# Estimated target size band for a compressed-4K encode (GiB).
# est_target = clamp(size * TARGET_RATIO, TARGET_MIN_GB, TARGET_MAX_GB)
TARGET_MIN_GB=15
TARGET_MAX_GB=25
TARGET_RATIO=0.28

# Multi-version prune: files >= this (GiB) count as "large versions".
MULTIVERSION_MIN_GB=1

# Movies scope only in this campaign; TV is untouched.
SCAN_TV=false
