[pihole]
# Define your Pi-hole server here
# If running locally, use localhost
localhost ansible_connection=local

# For remote Pi-hole:
# pihole.example.com ansible_user=pi ansible_ssh_private_key_file=~/.ssh/id_rsa

[pihole:vars]
# Common variables for all Pi-hole hosts
ansible_python_interpreter=/usr/bin/python3

# Linux Docker hosts that have the homelab-config repo checked out.
# Used by security-watch.yml to deploy the IOC watcher on each node.
# (Proxmox LXCs are deployed separately from the kuat-drive-yards control plane.)
[linux_nodes]
nemesis    ansible_host=nemesis.rt-541.io    ansible_connection=local
devastator ansible_host=devastator.rt-541.io ansible_user=aschneider

[linux_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
