services:
  vllm:
    image: intel/llm-scaler-vllm:0.14.0-b8.3.1
    container_name: plex-compute-vllm
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    shm_size: 4g
    entrypoint: ["vllm"]
    command:
      - serve
      - Qwen/Qwen2.5-7B-Instruct
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - qwen2.5-7b-instruct
      # reserve ~4.8GB (15%) of the 32GB card for Plex: 2 concurrent 4K HDR
      # transcodes (~2GB each) + driver headroom; extra streams fall back to CPU
      - --gpu-memory-utilization
      - "0.85"
      # Qwen2.5-7B's native window is 32k; 64k uses static YaRN (factor 2 over
      # the 32k base), the method Qwen documents for long context. The Claude
      # Code harness alone needs ~16.4k tokens of prompt + tool schemas and
      # cannot auto-compact below a 100k window, so 32k overflowed within a few
      # turns. KV pool is unchanged (0.85): one 64k sequence is ~3.6 GB of the
      # ~12 GB pool; Plex's reservation is unaffected. Qwen notes static YaRN
      # can slightly degrade short-text quality; accepted for the note agents.
      - --max-model-len
      - "65536"
      - --hf-overrides
      - '{"rope_scaling":{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":32768}}'
      # An internal agent harness drives this endpoint through the Claude
      # Agent SDK (/v1/messages); without a tool-call parser the model returns tool
      # invocations as plain text. Hermes is the documented parser for Qwen2.5.
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    environment:
      HF_HOME: /models
    volumes:
      - /docker/llm/models:/models
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # first start downloads ~15GB of weights then loads them
      start_period: 30m
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    labels:
      - "autoheal=true"

  plex-compute-discord:
    image: alpine:latest
    container_name: plex-compute-discord
    restart: unless-stopped
    depends_on:
      - vllm
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - QUEUE_ALERT_THRESHOLD=${QUEUE_ALERT_THRESHOLD:-5}
    volumes:
      - ./notify.sh:/notify.sh:ro
    entrypoint: /bin/sh
    command: ["/notify.sh"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: "128M"
        reservations:
          cpus: '0.25'
          memory: "64M"

  plex-compute-autoheal:
    image: willfarrell/autoheal:latest
    container_name: plex-compute-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  plex-compute-logs:
    image: amir20/dozzle:latest
    container_name: plex-compute-logs
    restart: unless-stopped
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_FILTER: "name=plex-compute*"
