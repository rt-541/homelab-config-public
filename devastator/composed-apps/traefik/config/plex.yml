---
http:
  routers:
    plex-https:
      rule: "Host(`plex.rt-541.io`)"
      service: plex-service
      entrypoints:
        web:
        secure:
      tls:
        certResolver: default

  services:
    plex-service:
      loadBalancer:
        servers:
          - url: "https://192.168.1.216:32400/"