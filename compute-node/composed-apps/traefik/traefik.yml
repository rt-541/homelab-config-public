## traefik.yml

# Docker configuration backend
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    network: proxy
    exposedByDefault: false
  file:
    directory: "/config"
    watch: true

# API and dashboard configuration
api:
  dashboard: true
  # insecure: true

# only needed in v2
# experimental:
#   http3: true

# for proxmox because it has no certs
serversTransport:
  insecureSkipVerify: true
log:
  level: DEBUG
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: secure
          scheme: https
          permanent: true
  secure:
    address: ":443"
    asDefault: true
    http3: {}

  public-web:
    address: ":10080"
    http:
      redirections:
        entryPoint:
          to: public-secure
          scheme: https
          permanent: true
  public-secure:
    address: ":10443"
    http3: {}

certificatesResolvers:
  default:
    acme:
      email: arthurschneider.v@gmail.com
      storage: acme.json
      dnschallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
  acme-http:
    acme:
      email: arthurschneider.v@gmail.com
      storage: acme.json
      httpChallenge:
        entryPoint: public-web

tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        # Recommended ciphers for TLSv1.2
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        # Recommended ciphers for TLSv1.3
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
    tlsv13only:
      minVersion: VersionTLS13
