# media-transcoder policy (sourced by worker.sh).

# Run windows: semicolon-separated "<days> HH:MM-HH:MM" (overnight spans wrap).
# days: daily | Mon-Fri | Sat-Sun | single day name. Local time (TZ in compose).
# Nightly + work-day schedule per campaign decision 2026-09-01.
WINDOWS="daily 22:30-06:30; Mon-Fri 08:30-16:30"

# VA-API encode settings. VIDEO_QUALITY is ICQ global_quality: lower = better
# quality / bigger file. 22 targets roughly the 15-25G band for a 2-3h 4K
# film; tune after the pilot batch. RC_MODE=CQP is the fallback if the driver
# rejects ICQ.
ENCODER=hevc_vaapi
RC_MODE=ICQ
VIDEO_QUALITY=22
AUDIO_BITRATE=640k

# Stop for review after this many completed encodes until PILOT_ACK exists
# (touch /docker/plex/media/.reclaim/PILOT_ACK on nemesis to release).
PILOT_LIMIT=3

# Verification before the original is replaced: the encode's audio and video
# packets are counted per VERIFY_STEP-second block, and a 4 s clip from the
# middle of every block must decode and score >= VMAF_FAIL against the source
# (clips under VMAF_WARN are listed in the log; every score lands in
# .reclaim/qc-vmaf.tsv). VERIFY_VMAF=false keeps the decode checks only.
VERIFY_STEP=300
VERIFY_VMAF=true
VMAF_FAIL=60
VMAF_WARN=85
AUDIO_MIN_PPS=25

# PURGE_ON_PASS=true deletes the original as soon as its encode passes every
# check above. false keeps the last HOLD_COUNT originals per mount in
# .reclaim/holding/ (purged FIFO) instead.
PURGE_ON_PASS=true
HOLD_COUNT=10

# Plex library section rescanned after each swap (needs PLEX_TOKEN in .env).
PLEX_SECTION=1

# Skip starting new encodes while Plex has active video sessions
# (needs PLEX_TOKEN in .env; harmless if unset).
PLEX_GUARD=true

# Minimum free space on scratch before starting a job (GiB). Only the
# encoded OUTPUT lands on scratch (15-25G; the source is read over NFS), so
# 40G is enough.
MIN_SCRATCH_GB=40

# Where encodes are written before they replace the original. devastator's
# root disk fell to 37G free (2026-10-21) and blocked every job, so scratch
# lives on the media array over NFS; unset to use the local /scratch mount.
SCRATCH=/data/media/.reclaim/scratch

# Ownership applied to replacement files (plexadm on nemesis).
MEDIA_UID=1001
MEDIA_GID=1001

# Force a specific render node if auto-pick chooses wrong (e.g. a BMC GPU).
#VAAPI_DEVICE=/dev/dri/renderD128
