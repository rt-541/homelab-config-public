  zomboid-backup:
    image: offen/docker-volume-backup:v2
    container_name: zomboid-backup
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "0 4 * * *"
      BACKUP_RETENTION_DAYS: "21"
      BACKUP_FILENAME: "zomboid-%Y-%m-%dT%H-%M-%S.tar.gz"
    volumes:
      - /docker/game/zomboid/ZomboidConfig:/backup/ZomboidConfig:ro
      - /docker/game/zomboid/backups:/archive
