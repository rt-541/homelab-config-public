        published: 16261
        protocol: udp
      - target: 16262
        published: 16262
        protocol: udp
      - target: 27015
        published: 27015
        protocol: tcp
    volumes:
      - /docker/game/zomboid/ZomboidDedicatedServer:/home/steam/ZomboidDedicatedServer
      - /docker/game/zomboid/ZomboidConfig:/home/steam/Zomboid/
      - ./server.ini:/home/steam/Zomboid/Server/Flight Group Alpha PZ Server.ini
