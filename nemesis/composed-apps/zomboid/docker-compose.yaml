      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      ADMIN_USERNAME: "${ADMIN_USERNAME}"
      AUTOSAVE_INTERVAL: 15
      BIND_IP: "0.0.0.0"
      DEFAULT_PORT: 16261
      GAME_VERSION: "unstable"
      GC_CONFIG: G1GC
      MAP_NAMES: "Muldraugh, KY"
      MAX_PLAYERS: 16
