# href = public hostname (resolved by your browser as a LAN client).
# widget/siteMonitor url = INTERNAL endpoint (container name on the proxy net,
# or LAN/VIP IP) so server-side calls skip Traefik + the lan-only middleware.
# status dots = docker socket-proxy (server/container), not HTTP pings.

- Media:
    - Plex:
        href: https://plex.rt-541.io
        icon: plex.png
        description: Media server
        server: devastator
        container: plex
        widget:
          type: plex
          url: http://192.168.1.216:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
    - Seerr:
        href: https://seerr.rt-541.io
        icon: jellyseerr.png
        description: Request media
        server: nemesis
